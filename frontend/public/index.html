<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="description" content="LawSuites — Smart Legal Services Platform" />
    <title>LawSuites ⚖️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      :root {
        --navy: #0b0f1a;
        --navy-2: #111827;
        --navy-3: #1e2d45;
        --gold: #c9a84c;
        --gold-light: #e8d5a3;
        --gold-dark: #a07830;
        --cream: #f9f5ef;
        --white: #ffffff;
        --text-dark: #0b0f1a;
        --text-muted: #6b7280;
        --text-light: #94a3b8;
        --border: #e5e0d8;
        --ff-serif: 'Playfair Display', Georgia, serif;
        --ff-sans: 'Inter', system-ui, sans-serif;
      }
      body { font-family: var(--ff-sans); background: var(--cream); color: var(--text-dark); -webkit-font-smoothing: antialiased; }
      a { text-decoration: none; }
      button { font-family: var(--ff-sans); cursor: pointer; }
      input, textarea, select { font-family: var(--ff-sans); }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
